server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to vault-web3 API
    location /v1/ {
        proxy_pass http://api:8200;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
