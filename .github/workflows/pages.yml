# Builds the web UI and publishes it to GitHub Pages.
# The hosted UI is only the client: point it at your own chain and IPFS node in Settings.
name: Pages

on:
  push:
    branches: [main]
    paths: ["packages/ui/**", "packages/core/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build --workspace=packages/core
      - run: npm run build --workspace=packages/ui
        env:
          VITE_BASE: /   # served at the root of vault.criptografia.app
      # Pages has no SPA fallback: serve the app for deep links like /secrets too.
      - run: cp packages/ui/dist/index.html packages/ui/dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/ui/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
